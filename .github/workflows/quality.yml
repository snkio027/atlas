name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install locked quality tools
        uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.62.3

      - name: Run repository quality gate
        run: task quality

      - name: Compile Phase-0 VAP CEL on locked Kubernetes
        env:
          ATLAS_CI_KIND_VAP: "1"
        run: ./tests/recovery/vap-server-compile-contract.sh

      - name: Compile Phase-1A protection VAP CEL on locked Kubernetes
        env:
          ATLAS_CI_PHASE1A_VAP: "1"
        run: ./tests/gitops/protection-foundation-server-contract.sh

      - name: Verify Phase-1B observation is non-blocking on locked Kubernetes
        env:
          ATLAS_CI_PHASE1B_OBSERVING: "1"
        run: ./tests/gitops/protection-foundation-observation-server-contract.sh
