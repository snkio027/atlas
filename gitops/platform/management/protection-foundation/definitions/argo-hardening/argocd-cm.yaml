apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
    atlas.io/definition-state: uninstalled
data:
  admin.enabled: "false"
  users.anonymous.enabled: "false"
  resource.customizations.health.argoproj.io_Application: |
    local health = {
      status = "Progressing",
      message = "Waiting for child Application to become idle, Synced, and Healthy"
    }

    local sync_status = nil
    if obj.status ~= nil and obj.status.sync ~= nil then
      sync_status = obj.status.sync.status
    end

    local operation_active = obj.operation ~= nil
    if obj.status ~= nil and obj.status.operationState ~= nil then
      local phase = obj.status.operationState.phase
      operation_active = operation_active or phase == "Running" or phase == "Terminating"
    end

    if sync_status == "Synced" and not operation_active and
       obj.status ~= nil and obj.status.health ~= nil then
      health.status = obj.status.health.status or health.status
      health.message = obj.status.health.message or health.message
    end

    return health
