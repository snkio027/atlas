apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-control
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
    argocd.argoproj.io/sync-options: Prune=confirm
spec:
  project: platform-project
  source:
    repoURL: https://github.com/snkio027/atlas.git
    targetRevision: main
    path: gitops/platform/applications/base
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
