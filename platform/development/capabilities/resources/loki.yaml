apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: loki-data
      namespace: platform-logging
      annotations:
        argocd.argoproj.io/sync-options: Delete=false,Prune=confirm
    spec:
      storageClassName: atlas-local-retain
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 8Gi
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: loki-config
      namespace: platform-logging
    data:
      loki.yaml: |
        auth_enabled: false
        server:
          http_listen_port: 3100
          grpc_listen_port: 9095
        common:
          path_prefix: /data
          instance_addr: 127.0.0.1
          replication_factor: 1
          ring:
            kvstore:
              store: inmemory
          storage:
            filesystem:
              chunks_directory: /data/chunks
              rules_directory: /data/rules
        schema_config:
          configs:
            - from: 2026-01-01
              store: tsdb
              object_store: filesystem
              schema: v13
              index:
                prefix: index_
                period: 24h
        compactor:
          working_directory: /data/compactor
          retention_enabled: true
          delete_request_store: filesystem
        limits_config:
          retention_period: 72h
          ingestion_rate_mb: 2
          ingestion_burst_size_mb: 4
          max_query_parallelism: 4
          max_query_series: 500
          max_global_streams_per_user: 5000
        analytics:
          reporting_enabled: false
  - apiVersion: v1
    kind: Service
    metadata:
      name: loki
      namespace: platform-logging
      labels:
        app.kubernetes.io/name: loki
    spec:
      selector:
        app.kubernetes.io/name: loki
      ports:
        - name: http
          port: 3100
          targetPort: http
  - apiVersion: v1
    kind: Service
    metadata:
      name: loki-headless
      namespace: platform-logging
      labels:
        app.kubernetes.io/name: loki
    spec:
      selector:
        app.kubernetes.io/name: loki
      ports:
        - name: http
          port: 3100
          targetPort: http
      clusterIP: None
      publishNotReadyAddresses: true
  - apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: loki
      namespace: platform-logging
    spec:
      replicas: 1
      selector:
        matchLabels:
          app.kubernetes.io/name: loki
      template:
        metadata:
          labels:
            app.kubernetes.io/name: loki
          annotations:
            checksum/config: 61d301bc8b1e344e8141afc0b54070ef77459ac10c251649be2d48855e177783
        spec:
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/os: linux
            node-role.local/data: "true"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: loki
              image: docker.io/grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 768Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              ports:
                - name: http
                  containerPort: 3100
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                  readOnly: false
                - name: data
                  mountPath: /data
                  readOnly: false
                - name: loki-config
                  mountPath: /config
                  readOnly: true
              args:
                - -config.file=/config/loki.yaml
              startupProbe:
                httpGet:
                  path: /ready
                  port: http
                periodSeconds: 5
                failureThreshold: 60
              readinessProbe:
                httpGet:
                  path: /ready
                  port: http
                periodSeconds: 10
                timeoutSeconds: 3
                failureThreshold: 3
              livenessProbe:
                httpGet:
                  path: /ready
                  port: http
                periodSeconds: 20
                timeoutSeconds: 5
                failureThreshold: 6
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 128Mi
            - name: data
              persistentVolumeClaim:
                claimName: loki-data
            - name: loki-config
              configMap:
                name: loki-config
                defaultMode: 292
          terminationGracePeriodSeconds: 60
          tolerations:
            - key: node-role.local/data
              operator: Equal
              value: "true"
              effect: NoSchedule
      serviceName: loki-headless
      persistentVolumeClaimRetentionPolicy:
        whenDeleted: Retain
        whenScaled: Retain
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: loki-ingress
      namespace: platform-logging
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/name: loki
      policyTypes:
        - Ingress
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: platform-logging
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: alloy
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: platform-monitoring
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: grafana
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: platform-monitoring
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: prometheus
          ports:
            - protocol: TCP
              port: 3100
