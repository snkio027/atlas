schema: 2
components:
  secrets-crds:
    path: gitops/platform/management/sealed-secrets-crds/overlays/development
    namespace: platform-sealed-secrets
    wave: -95
    dependsOn:
      - secrets-foundation
    requiredSecrets: []
    permissionDomain: security
  secrets-controller:
    path: gitops/platform/management/sealed-secrets/overlays/development
    namespace: platform-sealed-secrets
    wave: -90
    dependsOn:
      - secrets-crds
    requiredSecrets: []
    permissionDomain: security
  platform-credentials:
    path: gitops/platform/management/platform-credentials/overlays/development
    namespace: platform-monitoring
    wave: -80
    dependsOn:
      - secrets-controller
      - observability-foundation
      - storage-foundation
    requiredSecrets: []
    permissionDomain: security
  monitoring-crds:
    path: gitops/platform/observability/crds/overlays/development
    namespace: platform-monitoring
    wave: -40
    dependsOn:
      - observability-foundation
    requiredSecrets: []
    permissionDomain: observability
  monitoring-operator:
    path: gitops/platform/observability/operator/overlays/development
    namespace: platform-monitoring
    wave: -30
    dependsOn:
      - monitoring-crds
      - core:cert-manager
    requiredSecrets: []
    permissionDomain: observability
  monitoring:
    path: gitops/platform/observability/stack/overlays/development
    namespace: platform-monitoring
    wave: -10
    dependsOn:
      - monitoring-operator
      - platform-credentials
      - core:local-storage
    requiredSecrets:
      - namespace: platform-monitoring
        name: grafana-admin
        keys:
          - admin-user
          - admin-password
    permissionDomain: observability
  object-storage:
    path: gitops/platform/storage/seaweedfs/overlays/development
    namespace: service-object-storage
    wave: -10
    dependsOn:
      - platform-credentials
      - core:local-storage
    requiredSecrets:
      - namespace: service-object-storage
        name: seaweedfs-auth
        keys:
          - seaweedfs_s3_config
      - namespace: project-platform-smoke
        name: s3-client
        keys:
          - AWS_ACCESS_KEY_ID
          - AWS_SECRET_ACCESS_KEY
    permissionDomain: storage
  storage-monitoring:
    path: gitops/platform/observability/storage/overlays/development
    namespace: platform-monitoring
    wave: 0
    dependsOn:
      - monitoring
      - object-storage
    requiredSecrets: []
    permissionDomain: observability
  secrets-foundation:
    path: gitops/platform/foundation/secrets/overlays/development
    namespace: platform-sealed-secrets
    wave: -100
    dependsOn: []
    requiredSecrets: []
    permissionDomain: security
  observability-foundation:
    path: gitops/platform/foundation/observability/overlays/development
    namespace: platform-monitoring
    wave: -100
    dependsOn: []
    requiredSecrets: []
    permissionDomain: observability
  storage-foundation:
    path: gitops/platform/foundation/storage/overlays/development
    namespace: service-object-storage
    wave: -100
    dependsOn: []
    requiredSecrets: []
    permissionDomain: storage
  postgresql-foundation:
    path: gitops/platform/foundation/postgresql/overlays/development
    namespace: service-postgresql
    wave: -100
    dependsOn: []
    requiredSecrets: []
    permissionDomain: data
  redis-foundation:
    path: gitops/platform/foundation/redis/overlays/development
    namespace: service-redis
    wave: -100
    dependsOn: []
    requiredSecrets: []
    permissionDomain: data
  kafka-foundation:
    path: gitops/platform/foundation/kafka/overlays/development
    namespace: service-kafka
    wave: -100
    dependsOn: []
    requiredSecrets: []
    permissionDomain: data
  flink-foundation:
    path: gitops/platform/foundation/flink/overlays/development
    namespace: service-flink-session
    wave: -100
    dependsOn: []
    requiredSecrets: []
    permissionDomain: data
  logging-foundation:
    path: gitops/platform/foundation/logging/overlays/development
    namespace: platform-logging
    wave: -100
    dependsOn: []
    requiredSecrets: []
    permissionDomain: data
  data-credentials:
    path: gitops/platform/data/data-credentials/overlays/development
    namespace: service-postgresql
    wave: -60
    dependsOn:
      - secrets-controller
      - postgresql-foundation
      - redis-foundation
      - flink-foundation
      - flink-operator-foundation
    requiredSecrets: []
    permissionDomain: security
  data-pki:
    path: gitops/platform/data/data-pki/overlays/development
    namespace: service-redis
    wave: -20
    dependsOn:
      - redis-foundation
      - core:cert-manager
    requiredSecrets: []
    permissionDomain: security
  postgresql:
    path: gitops/platform/data/postgresql/overlays/development
    namespace: service-postgresql
    wave: 10
    dependsOn:
      - postgresql-operator
      - core:local-storage
      - data-credentials
    requiredSecrets:
      - namespace: service-postgresql
        name: postgresql-app
        keys:
          - username
          - password
    permissionDomain: data
  redis:
    path: gitops/platform/data/redis/overlays/development
    namespace: service-redis
    wave: 10
    dependsOn:
      - data-credentials
      - data-pki
      - core:local-storage
    requiredSecrets:
      - namespace: service-redis
        name: redis-auth
        keys:
          - password
          - users.acl
    permissionDomain: data
  kafka:
    path: gitops/platform/data/kafka/overlays/development
    namespace: service-kafka
    wave: 10
    dependsOn:
      - kafka-operator
      - core:local-storage
    requiredSecrets: []
    permissionDomain: data
  flink:
    path: gitops/platform/data/flink/overlays/development
    namespace: service-flink-session
    wave: 10
    dependsOn:
      - flink-operator
      - core:local-storage
    requiredSecrets: []
    permissionDomain: data
  loki:
    path: gitops/platform/data/loki/overlays/development
    namespace: platform-logging
    wave: 10
    dependsOn:
      - logging-foundation
      - core:local-storage
    requiredSecrets: []
    permissionDomain: observability
  log-collection:
    path: gitops/platform/data/log-collection/overlays/development
    namespace: platform-logging
    wave: 20
    dependsOn:
      - loki
      - postgresql-foundation
      - redis-foundation
      - kafka-foundation
      - flink-foundation
      - core:foundation
    requiredSecrets: []
    permissionDomain: observability
  data-observability:
    path: gitops/platform/data/data-observability/overlays/development
    namespace: platform-monitoring
    wave: 30
    dependsOn:
      - monitoring
      - log-collection
    requiredSecrets: []
    permissionDomain: observability
  postgresql-crds:
    path: gitops/platform/data/postgresql-crds/overlays/development
    namespace: platform-cnpg-operator
    wave: -85
    dependsOn:
      - postgresql-foundation
      - postgresql-operator-foundation
    requiredSecrets: []
    permissionDomain: data
  postgresql-operator:
    path: gitops/platform/data/postgresql-operator/overlays/development
    namespace: platform-cnpg-operator
    wave: -10
    dependsOn:
      - postgresql-crds
    requiredSecrets: []
    permissionDomain: data
  kafka-crds:
    path: gitops/platform/data/kafka-crds/overlays/development
    namespace: platform-strimzi-operator
    wave: -85
    dependsOn:
      - kafka-foundation
      - kafka-operator-foundation
    requiredSecrets: []
    permissionDomain: data
  kafka-operator:
    path: gitops/platform/data/kafka-operator/overlays/development
    namespace: platform-strimzi-operator
    wave: -10
    dependsOn:
      - kafka-crds
    requiredSecrets: []
    permissionDomain: data
  flink-crds:
    path: gitops/platform/data/flink-crds/overlays/development
    namespace: platform-flink-operator
    wave: -85
    dependsOn:
      - flink-foundation
      - flink-operator-foundation
    requiredSecrets: []
    permissionDomain: data
  flink-operator:
    path: gitops/platform/data/flink-operator/overlays/development
    namespace: platform-flink-operator
    wave: -10
    dependsOn:
      - flink-crds
      - data-credentials
      - core:cert-manager
    requiredSecrets:
      - namespace: platform-flink-operator
        name: flink-webhook-password
        keys:
          - password
    permissionDomain: data
  postgresql-operator-foundation:
    path: gitops/platform/foundation/postgresql-operator/overlays/development
    namespace: platform-cnpg-operator
    wave: -100
    dependsOn: []
    requiredSecrets: []
    permissionDomain: data
  kafka-operator-foundation:
    path: gitops/platform/foundation/kafka-operator/overlays/development
    namespace: platform-strimzi-operator
    wave: -100
    dependsOn: []
    requiredSecrets: []
    permissionDomain: data
  flink-operator-foundation:
    path: gitops/platform/foundation/flink-operator/overlays/development
    namespace: platform-flink-operator
    wave: -100
    dependsOn: []
    requiredSecrets: []
    permissionDomain: data
jobs:
  - release: sealed-secrets
    chart: vendor/platform/sealed-secrets-2.20.0.tgz
    namespace: platform-sealed-secrets
    values:
      - platform/development/capabilities/values/sealed-secrets.json
    excludeComponents: []
    outputs:
      - component: secrets-crds
        kinds:
          - CustomResourceDefinition
      - component: secrets-controller
        kinds: []
    namespaceCapabilities:
      platform-sealed-secrets: secrets-foundation
      platform-monitoring: observability-foundation
      service-object-storage: storage-foundation
      project-platform-smoke: core:foundation
      service-postgresql: postgresql-foundation
      service-redis: redis-foundation
      service-flink-session: flink-foundation
      platform-cnpg-operator: postgresql-operator-foundation
      platform-strimzi-operator: kafka-operator-foundation
      platform-flink-operator: flink-operator-foundation
  - release: atlas-monitoring
    chart: vendor/platform/kube-prometheus-stack-92.3.0.tgz
    namespace: platform-monitoring
    values:
      - platform/development/capabilities/values/monitoring.json
      - platform/development/capabilities/values/operator-only.json
    excludeComponents: []
    outputs:
      - component: monitoring-crds
        kinds:
          - CustomResourceDefinition
      - component: monitoring-operator
        kinds: []
  - release: atlas-monitoring
    chart: vendor/platform/kube-prometheus-stack-92.3.0.tgz
    namespace: platform-monitoring
    values:
      - platform/development/capabilities/values/monitoring.json
    excludeComponents:
      - monitoring-crds
      - monitoring-operator
    outputs:
      - component: monitoring
        kinds: []
    projectedTokenMonitors:
      - atlas-monitoring-kubelet
      - atlas-monitoring-apiserver
  - release: cnpg
    chart: vendor/platform/cloudnative-pg-0.29.1.tgz
    namespace: platform-cnpg-operator
    values:
      - platform/development/capabilities/values/cnpg.json
    excludeComponents: []
    outputs:
      - component: postgresql-crds
        kinds:
          - CustomResourceDefinition
      - component: postgresql-operator
        kinds: []
  - release: strimzi
    chart: vendor/platform/strimzi-kafka-operator-helm-3-chart-1.3.0.tgz
    namespace: platform-strimzi-operator
    values:
      - platform/development/capabilities/values/strimzi.json
    excludeComponents: []
    outputs:
      - component: kafka-crds
        kinds:
          - CustomResourceDefinition
      - component: kafka-operator
        kinds: []
  - release: flink-operator
    chart: vendor/platform/flink-kubernetes-operator-1.16.0-helm.tgz
    namespace: platform-flink-operator
    values:
      - platform/development/capabilities/values/flink-operator.json
    excludeComponents: []
    outputs:
      - component: flink-crds
        kinds:
          - CustomResourceDefinition
      - component: flink-operator
        kinds: []
permissionDomains:
  security: platform-project
  observability: platform-project
  storage: platform-project
  data: platform-project
