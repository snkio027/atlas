apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: atlas-bootstrap-recovery-permission-authorization
  labels:
    app.kubernetes.io/part-of: atlas-recovery
    atlas.io/definition-state: uninstalled
  annotations:
    atlas.io/activation-inputs: recoveryPrincipal,sessionAuthorizerPrincipal
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups:
          - rbac.authorization.k8s.io
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
          - DELETE
        resources:
          - rolebindings
        scope: Namespaced
      - apiGroups:
          - rbac.authorization.k8s.io
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
          - DELETE
        resources:
          - clusterrolebindings
        scope: Cluster
  matchConditions:
    - name: approved-recovery-binding-scope
      expression: >-
        request.resource.resource == 'clusterrolebindings' ||
        request.namespace in ['argocd', 'kube-system']
  variables:
    - name: binding
      expression: "request.operation == 'DELETE' ? oldObject : object"
    - name: scopeName
      expression: >-
        request.resource.resource == 'clusterrolebindings'
          ? 'cluster'
          : request.namespace
  validations:
    - expression: "params != null"
      message: Operation Fence parameter is required
      reason: Forbidden
    - expression: >-
        params.metadata.namespace == 'kube-system' &&
        params.metadata.name == 'atlas-bootstrap-operation-fence' &&
        has(params.immutable) && params.immutable &&
        has(params.data) && params.data.size() == 11 &&
        params.data.schema == 'atlas.io/bootstrap-operation-fence/v1' &&
        params.data.mode == 'recovery'
      message: Permission parameter is not the canonical immutable recovery Fence
      reason: Forbidden
    - expression: >-
        request.userInfo.username == params.data.authorizerPrincipal &&
        params.data.authorizerPrincipal ==
          'atlas:session-authz:00000000-0000-0000-0000-000000000000:g1' &&
        params.data.recoveryPrincipal ==
          'atlas:break-glass:00000000-0000-0000-0000-000000000000:g1' &&
        variables.binding.metadata.labels['atlas.io/recovery-session'] ==
          params.data.sessionID &&
        variables.binding.metadata.annotations['atlas.io/recovery-plan-sha256'] ==
          params.data.planSHA256 &&
        variables.binding.metadata.annotations['atlas.io/recovery-target-sha256'] ==
          params.data.clusterFingerprintSHA256 &&
        variables.binding.metadata.annotations['atlas.io/recovery-revision'] ==
          params.data.knownGoodRevision &&
        variables.binding.metadata.annotations['atlas.io/recovery-fence-uid'] ==
          params.metadata.uid
      message: Temporary Binding does not match the Fence lineage
      reason: Forbidden
    - expression: >-
        request.operation != 'UPDATE' &&
        variables.binding.metadata.name ==
          'atlas-bg-' + variables.scopeName + '-' + params.data.sessionID &&
        ((variables.scopeName == 'cluster' &&
          variables.binding.roleRef.kind == 'ClusterRole' &&
          variables.binding.roleRef.name == 'atlas-bootstrap-recovery-cluster') ||
        (variables.scopeName in ['argocd', 'kube-system'] &&
          variables.binding.roleRef.kind == 'Role' &&
          variables.binding.roleRef.name == 'atlas-bootstrap-recovery')) &&
        variables.binding.subjects.size() == 1 &&
        variables.binding.subjects[0].kind == 'User' &&
        variables.binding.subjects[0].name == params.data.recoveryPrincipal
      message: Temporary Binding target is invalid
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: atlas-bootstrap-recovery-permission-authorization
  labels:
    app.kubernetes.io/part-of: atlas-recovery
    atlas.io/definition-state: uninstalled
spec:
  policyName: atlas-bootstrap-recovery-permission-authorization
  matchResources:
    objectSelector:
      matchLabels:
        atlas.io/recovery-scope: production
      matchExpressions:
        - key: atlas.io/recovery-session
          operator: Exists
  paramRef:
    name: atlas-bootstrap-operation-fence
    namespace: kube-system
    parameterNotFoundAction: Deny
  validationActions:
    - Audit
