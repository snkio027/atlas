---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "annotations": null,
    "labels": {
      "app.kubernetes.io/instance": "sealed-secrets",
      "app.kubernetes.io/managed-by": "Helm",
      "app.kubernetes.io/name": "sealed-secrets",
      "app.kubernetes.io/part-of": "sealed-secrets",
      "app.kubernetes.io/version": "0.40.0",
      "helm.sh/chart": "sealed-secrets-2.20.0"
    },
    "name": "sealed-secrets",
    "namespace": "sealed-secrets"
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app.kubernetes.io/instance": "sealed-secrets",
        "app.kubernetes.io/name": "sealed-secrets"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app.kubernetes.io/instance": "sealed-secrets",
          "app.kubernetes.io/name": "sealed-secrets"
        }
      },
      "spec": {
        "containers": [
          {
            "args": [
              "--update-status",
              "--key-renew-period",
              "0",
              "--key-prefix",
              "sealed-secrets-key",
              "--additional-namespaces",
              "sealed-secrets,monitoring,object-storage,workload-web",
              "--listen-addr",
              ":8080",
              "--listen-metrics-addr",
              ":8081"
            ],
            "command": [
              "controller"
            ],
            "env": [
              {
                "name": "GOMEMLIMIT",
                "valueFrom": {
                  "resourceFieldRef": {
                    "divisor": "1",
                    "resource": "limits.memory"
                  }
                }
              }
            ],
            "image": "docker.io/bitnami/sealed-secrets-controller:0.40.0@sha256:b1ff382e9300dc9e74991f3177b18cafc06ce43b5c21349c86adbdd1d1c177d3",
            "imagePullPolicy": "IfNotPresent",
            "livenessProbe": {
              "failureThreshold": 3,
              "httpGet": {
                "path": "/healthz",
                "port": "http"
              },
              "initialDelaySeconds": 0,
              "periodSeconds": 10,
              "successThreshold": 1,
              "timeoutSeconds": 1
            },
            "name": "controller",
            "ports": [
              {
                "containerPort": 8080,
                "name": "http",
                "protocol": "TCP"
              },
              {
                "containerPort": 8081,
                "name": "metrics",
                "protocol": "TCP"
              }
            ],
            "readinessProbe": {
              "failureThreshold": 3,
              "httpGet": {
                "path": "/healthz",
                "port": "http"
              },
              "initialDelaySeconds": 0,
              "periodSeconds": 10,
              "successThreshold": 1,
              "timeoutSeconds": 1
            },
            "resources": {
              "limits": {
                "memory": "192Mi"
              },
              "requests": {
                "cpu": "20m",
                "memory": "64Mi"
              }
            },
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              },
              "readOnlyRootFilesystem": true,
              "runAsNonRoot": true,
              "runAsUser": 1001
            },
            "volumeMounts": [
              {
                "mountPath": "/tmp",
                "name": "tmp"
              }
            ]
          }
        ],
        "nodeSelector": {
          "kubernetes.io/os": "linux",
          "node-role.local/compute": "true"
        },
        "securityContext": {
          "fsGroup": 65534,
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "serviceAccountName": "sealed-secrets",
        "volumes": [
          {
            "emptyDir": {},
            "name": "tmp"
          }
        ]
      }
    }
  }
}
