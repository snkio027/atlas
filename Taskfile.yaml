version: "3"

tasks:
  bootstrap:doctor:
    desc: Run read-only Bootstrap preflight checks
    cmds:
      - ./bootstrap/atlas doctor

  bootstrap:render:
    desc: Render the Argo CD Seed and External Root locally
    cmds:
      - ./bootstrap/atlas render

  bootstrap:apply:
    desc: Reconcile Bootstrap and perform the explicitly approved Tier-0 handoff
    cmds:
      - ./bootstrap/atlas apply --approve-tier0

  bootstrap:status:
    desc: Read Bootstrap and GitOps handoff status
    cmds:
      - ./bootstrap/atlas status

  quality:
    desc: Run every mandatory local quality gate
    cmds:
      - task: lint
      - task: test
      - task: conformance

  lint:
    desc: Check Shell syntax, ShellCheck, and shfmt
    cmds:
      - ./tests/shell/lint.sh

  test:
    desc: Run Bootstrap safety and configuration tests
    cmds:
      - ./tests/shell/config.sh
      - ./tests/bootstrap/docker-authority-contract.sh
      - ./tests/bootstrap/cluster-contract.sh
      - ./tests/bootstrap/kind-topology-contract.sh
      - ./tests/bootstrap/registry-node-contract.sh
      - ./tests/bootstrap/safety-contract.sh
      - ./tests/bootstrap/status-contract.sh
      - ./tests/recovery/audit-config-contract.sh
      - ./tests/drill/kind-create-contract.sh

  conformance:
    desc: Run render, architecture, and supply-chain contracts
    cmds:
      - ./tests/bootstrap/render-contract.sh
      - ./tests/gitops/conformance.sh

  integration:
    desc: Run the explicit mutating Kind Bootstrap test
    env:
      ATLAS_INTEGRATION: "1"
    cmds:
      - ./tests/integration/kind-bootstrap.sh
