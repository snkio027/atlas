watchNamespaces:
  - service-flink-session
image:
  repository: docker.io/apache/flink-kubernetes-operator
  tag: 1.16.0
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 9999
  runAsGroup: 9999
  fsGroup: 9999
  seccompProfile:
    type: RuntimeDefault
operatorSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
webhookSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
operatorPod:
  nodeSelector:
    node-role.local/compute: "true"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  webhook:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi
webhook:
  keystore:
    useDefaultPassword: false
    passwordSecretRef:
      name: flink-webhook-password
      key: password
    pkcs12Profile: Modern2023
jvmArgs:
  operator: -Xms128m -Xmx256m -Djava.io.tmpdir=/opt/flink/artifacts
  webhook: -Xms64m -Xmx128m
defaultConfiguration:
  config.yaml: |
    kubernetes.operator:
      reconcile.interval: 15 s
      observer.progress-check.interval: 5 s
      deployment.rollback.enabled: false
rbac:
  jobRole:
    create: false
  jobRoleBinding:
    create: false
