apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: platform-monitoring
      labels:
        atlas.local/owner: platform
        pod-security.kubernetes.io/enforce: privileged
        atlas.local/class: platform
        atlas.local/domain: observability
      annotations:
        argocd.argoproj.io/sync-options: Delete=false,Prune=false
  - apiVersion: v1
    kind: ResourceQuota
    metadata:
      name: platform-budget
      namespace: platform-monitoring
    spec:
      hard:
        requests.cpu: "3"
        requests.memory: 4Gi
        limits.memory: 8Gi
        requests.storage: 32Gi
        persistentvolumeclaims: "8"
        pods: "32"
  - apiVersion: v1
    kind: LimitRange
    metadata:
      name: defaults
      namespace: platform-monitoring
    spec:
      limits:
        - type: Container
          default:
            memory: 256Mi
          defaultRequest:
            cpu: 10m
            memory: 32Mi
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: monitoring-ingress
      namespace: platform-monitoring
    spec:
      podSelector:
        matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
              - prometheus
              - alertmanager
              - grafana
              - prometheus-node-exporter
              - kube-state-metrics
      policyTypes:
        - Ingress
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: platform-monitoring
              podSelector:
                matchLabels: {}
