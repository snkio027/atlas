apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: seaweedfs-data
      namespace: service-object-storage
      annotations:
        argocd.argoproj.io/sync-options: Delete=false,Prune=confirm
    spec:
      storageClassName: atlas-local-retain
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 16Gi
  - apiVersion: v1
    kind: Service
    metadata:
      name: seaweedfs
      namespace: service-object-storage
      labels:
        app.kubernetes.io/name: seaweedfs
    spec:
      selector:
        app.kubernetes.io/name: seaweedfs
      ports:
        - name: s3
          port: 8333
          targetPort: s3
        - name: metrics
          port: 9324
          targetPort: metrics
  - apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: seaweedfs
      namespace: service-object-storage
    spec:
      serviceName: seaweedfs
      replicas: 1
      selector:
        matchLabels:
          app.kubernetes.io/name: seaweedfs
      template:
        metadata:
          labels:
            app.kubernetes.io/name: seaweedfs
        spec:
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/os: linux
            node-role.local/data: "true"
          tolerations:
            - key: node-role.local/data
              operator: Equal
              value: "true"
              effect: NoSchedule
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: seaweedfs
              image: docker.io/chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
              command:
                - weed
              args:
                - mini
                - -dir=/data
                - -ip=127.0.0.1
                - -ip.bind=0.0.0.0
                - -webdav=false
                - -admin.ui=false
                - -s3.iam=false
                - -s3.config=/etc/seaweedfs/seaweedfs_s3_config
                - -bucket=uploads
                - -s3.autoCreateBucket=false
                - -s3.allowDeleteBucketNotEmpty=false
                - -s3.concurrentUploadLimitMB=128
                - -metricsPort=9324
                - -s3.port.iceberg=0
                - -s3.port.lance=0
                - -master.volumeSizeLimitMB=128
                - -volume.max=96
              ports:
                - name: s3
                  containerPort: 8333
                - name: metrics
                  containerPort: 9324
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 768Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              startupProbe:
                tcpSocket:
                  port: s3
                periodSeconds: 5
                failureThreshold: 60
              readinessProbe:
                tcpSocket:
                  port: s3
                periodSeconds: 10
              livenessProbe:
                tcpSocket:
                  port: s3
                periodSeconds: 20
                failureThreshold: 6
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: auth
                  mountPath: /etc/seaweedfs
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: seaweedfs-data
            - name: auth
              secret:
                secretName: seaweedfs-auth
            - name: tmp
              emptyDir:
                sizeLimit: 128Mi
