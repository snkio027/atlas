      - apiGroups:
          - ""
        resources:
          - pods/log
        verbs:
          - get
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: alloy-logs
      namespace: service-kafka
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: alloy-logs
    subjects:
      - kind: ServiceAccount
        name: alloy
        namespace: platform-logging
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: alloy-logs
      namespace: service-flink-session
    rules:
      - apiGroups:
          - ""
        resources:
          - pods
        verbs:
          - get
          - list
          - watch
      - apiGroups:
          - ""
        resources:
          - pods/log
        verbs:
          - get
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: alloy-logs
      namespace: service-flink-session
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: alloy-logs
    subjects:
      - kind: ServiceAccount
        name: alloy
        namespace: platform-logging
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: alloy-logs
      namespace: project-platform-smoke
    rules:
      - apiGroups:
          - ""
        resources:
          - pods
        verbs:
          - get
          - list
          - watch
      - apiGroups:
          - ""
        resources:
          - pods/log
        verbs:
          - get
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: alloy-logs
      namespace: project-platform-smoke
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
