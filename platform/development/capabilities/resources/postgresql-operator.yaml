apiVersion: v1
kind: List
items:
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: operator-control
      namespace: platform-cnpg-operator
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/name: cloudnative-pg
      policyTypes:
        - Ingress
        - Egress
      ingress:
        - ports:
            - protocol: TCP
              port: 9443
      egress:
        - ports:
            - protocol: TCP
              port: 443
            - protocol: TCP
              port: 6443
        - to:
            - podSelector:
                matchLabels:
                  cnpg.io/cluster: postgresql
              namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: service-postgresql
          ports:
            - protocol: TCP
              port: 8000
            - protocol: TCP
              port: 5432
