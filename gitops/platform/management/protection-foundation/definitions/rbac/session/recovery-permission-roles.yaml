apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: atlas-bootstrap-recovery-cluster
  labels:
    app.kubernetes.io/part-of: atlas-recovery
    atlas.io/definition-state: uninstalled
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
    resourceNames:
      - argocd
      - kube-system
    verbs:
      - get
  - apiGroups:
      - admissionregistration.k8s.io
    resources:
      - validatingadmissionpolicies
      - validatingadmissionpolicybindings
    resourceNames:
      - atlas-bootstrap-evidence-protection
      - atlas-bootstrap-recovery-binding-shape-authorization
      - atlas-bootstrap-recovery-fence-authorization
      - atlas-bootstrap-recovery-guard-authorization
      - atlas-bootstrap-recovery-permission-authorization
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: atlas-bootstrap-recovery
  namespace: kube-system
  labels:
    app.kubernetes.io/part-of: atlas-recovery
    atlas.io/definition-state: uninstalled
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - atlas-bootstrap-adoption-receipt
      - atlas-bootstrap-identity
      - atlas-bootstrap-operation-fence
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: atlas-bootstrap-recovery
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: atlas-recovery
    atlas.io/definition-state: uninstalled
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - atlas-bootstrap-adoption-signal
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - argocd-rbac-cm
    verbs:
      - get
      - patch
      - update
