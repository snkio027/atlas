apiVersion: v1
kind: List
items:
  - apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: project-bootstrap
      namespace: platform-argocd
      annotations:
        argocd.argoproj.io/sync-wave: "-110"
        argocd.argoproj.io/sync-options: Prune=confirm,Delete=false
    spec:
      project: atlas-bootstrap
      source:
        repoURL: https://github.com/snkio027/atlas-refactor.git
        targetRevision: codex/development-platform
        path: gitops/platform/management/projects/overlays/development
      destination:
        server: https://kubernetes.default.svc
        namespace: platform-argocd
      syncPolicy:
        automated:
          enabled: true
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
          - FailOnSharedResource=true
  - apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: platform-control
      namespace: platform-argocd
      annotations:
        argocd.argoproj.io/sync-wave: "-100"
        argocd.argoproj.io/sync-options: Prune=confirm,Delete=false
    spec:
      project: platform-project
      source:
        repoURL: https://github.com/snkio027/atlas-refactor.git
        targetRevision: codex/development-platform
        path: gitops/platform/applications/overlays/development
      destination:
        server: https://kubernetes.default.svc
        namespace: platform-argocd
      syncPolicy:
        automated:
          enabled: true
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
          - FailOnSharedResource=true
  - apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: workload-control
      namespace: platform-argocd
      annotations:
        argocd.argoproj.io/sync-wave: "0"
        argocd.argoproj.io/sync-options: Prune=confirm,Delete=false
    spec:
      project: platform-project
      source:
        repoURL: https://github.com/snkio027/atlas-refactor.git
        targetRevision: codex/development-platform
        path: gitops/workloads/applications/overlays/development
      destination:
        server: https://kubernetes.default.svc
        namespace: platform-argocd
      syncPolicy:
        automated:
          enabled: true
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
          - FailOnSharedResource=true
