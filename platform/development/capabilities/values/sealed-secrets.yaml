fullnameOverride: sealed-secrets
namespace: platform-sealed-secrets
nodeSelector:
  kubernetes.io/os: linux
  node-role.local/compute: "true"
resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 192Mi
metrics:
  serviceMonitor:
    enabled: false
keyrenewperiod: "0"
additionalNamespaces:
  - sealed-secrets
  - platform-monitoring
  - service-object-storage
  - project-platform-smoke
rbac:
  create: true
  clusterRole: false
  namespacedRoles: true
