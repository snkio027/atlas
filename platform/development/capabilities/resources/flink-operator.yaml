apiVersion: v1
kind: List
items:
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: operator-control
      namespace: platform-flink-operator
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/name: flink-kubernetes-operator
      policyTypes:
        - Ingress
        - Egress
      ingress:
        - ports:
            - protocol: TCP
              port: 9443
      egress:
        - ports:
            - protocol: TCP
              port: 443
            - protocol: TCP
              port: 6443
        - to:
            - podSelector:
                matchLabels:
                  atlas.local/data-runtime: flink
              namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: service-flink-session
          ports:
            - protocol: TCP
              port: 8081
