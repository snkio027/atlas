apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: atlas-bootstrap
  namespace: platform-argocd
spec:
  sourceRepos:
    - https://github.com/snkio027/atlas.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: platform-argocd
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Application
    - group: argoproj.io
      kind: AppProject
