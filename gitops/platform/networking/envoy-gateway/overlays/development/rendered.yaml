{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "labels": {
      "app.kubernetes.io/instance": "eg",
      "app.kubernetes.io/managed-by": "Helm",
      "app.kubernetes.io/name": "gateway-helm",
      "app.kubernetes.io/version": "v1.9.2",
      "control-plane": "envoy-gateway",
      "helm.sh/chart": "gateway-helm-v1.9.2"
    },
    "name": "envoy-gateway",
    "namespace": "envoy-gateway-system"
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app.kubernetes.io/instance": "eg",
        "app.kubernetes.io/name": "gateway-helm",
        "control-plane": "envoy-gateway"
      }
    },
    "template": {
      "metadata": {
        "annotations": {
          "prometheus.io/port": "19001",
          "prometheus.io/scrape": "true"
        },
        "labels": {
          "app.kubernetes.io/instance": "eg",
          "app.kubernetes.io/name": "gateway-helm",
          "control-plane": "envoy-gateway"
        }
      },
      "spec": {
        "automountServiceAccountToken": true,
        "containers": [
          {
            "args": [
              "server",
              "--config-path=/config/envoy-gateway.yaml"
            ],
            "env": [
              {
                "name": "ENVOY_GATEWAY_NAMESPACE",
                "valueFrom": {
                  "fieldRef": {
                    "apiVersion": "v1",
                    "fieldPath": "metadata.namespace"
                  }
                }
              },
              {
                "name": "ENVOY_GATEWAY_SERVICE_ACCOUNT",
                "valueFrom": {
                  "fieldRef": {
                    "apiVersion": "v1",
                    "fieldPath": "spec.serviceAccountName"
                  }
                }
              },
              {
                "name": "ENVOY_GATEWAY_FULLNAME",
                "value": "eg-gateway-helm"
              },
              {
                "name": "KUBERNETES_CLUSTER_DOMAIN",
                "value": "cluster.local"
              }
            ],
            "image": "docker.io/envoyproxy/gateway:v1.9.2@sha256:9d67017c442a70e6ae9f1a358e6c80eb653c67c2e40823d9a991e0daf37ba926",
            "imagePullPolicy": "IfNotPresent",
            "livenessProbe": {
              "httpGet": {
                "path": "/healthz",
                "port": 8081
              },
              "periodSeconds": 20,
              "successThreshold": 1,
              "timeoutSeconds": 1
            },
            "name": "envoy-gateway",
            "ports": [
              {
                "containerPort": 18000,
                "name": "grpc"
              },
              {
                "containerPort": 18001,
                "name": "ratelimit"
              },
              {
                "containerPort": 18002,
                "name": "wasm"
              },
              {
                "containerPort": 19001,
                "name": "metrics"
              }
            ],
            "readinessProbe": {
              "httpGet": {
                "path": "/readyz",
                "port": 8081
              },
              "periodSeconds": 10,
              "successThreshold": 1,
              "timeoutSeconds": 1
            },
            "resources": {
              "limits": {
                "memory": "1024Mi"
              },
              "requests": {
                "cpu": "100m",
                "memory": "256Mi"
              }
            },
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              },
              "privileged": false,
              "readOnlyRootFilesystem": true,
              "runAsGroup": 65532,
              "runAsNonRoot": true,
              "runAsUser": 65532,
              "seccompProfile": {
                "type": "RuntimeDefault"
              }
            },
            "startupProbe": {
              "failureThreshold": 30,
              "httpGet": {
                "path": "/healthz",
                "port": 8081
              },
              "periodSeconds": 1,
              "successThreshold": 1,
              "timeoutSeconds": 1
            },
            "volumeMounts": [
              {
                "mountPath": "/config",
                "name": "envoy-gateway-config",
                "readOnly": true
              },
              {
                "mountPath": "/certs",
                "name": "certs",
                "readOnly": true
              },
              {
                "mountPath": "/var/lib/eg/wasm",
                "name": "wasm-cache"
              }
            ]
          }
        ],
        "imagePullSecrets": [],
        "nodeSelector": {
          "kubernetes.io/os": "linux",
          "node-role.local/compute": "true"
        },
        "securityContext": {
          "fsGroup": 65532,
          "runAsGroup": 65532,
          "runAsNonRoot": true,
          "runAsUser": 65532,
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "serviceAccountName": "envoy-gateway",
        "terminationGracePeriodSeconds": 10,
        "volumes": [
          {
            "configMap": {
              "defaultMode": 420,
              "name": "envoy-gateway-config"
            },
            "name": "envoy-gateway-config"
          },
          {
            "name": "certs",
            "secret": {
              "secretName": "envoy-gateway"
            }
          },
          {
            "emptyDir": {},
            "name": "wasm-cache"
          }
        ]
      }
    }
  }
}
