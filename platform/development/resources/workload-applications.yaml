apiVersion: v1
kind: List
items:
  - apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: web-smoke
      namespace: platform-argocd
      annotations:
        argocd.argoproj.io/sync-wave: "0"
        argocd.argoproj.io/sync-options: Prune=confirm,Delete=false
    spec:
      project: workload-project
      source:
        repoURL: https://github.com/snkio027/atlas-refactor.git
        targetRevision: codex/development-platform
        path: gitops/workloads/web-smoke/overlays/development
      destination:
        server: https://kubernetes.default.svc
        namespace: project-platform-smoke
      syncPolicy:
        automated:
          enabled: true
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
          - FailOnSharedResource=true
