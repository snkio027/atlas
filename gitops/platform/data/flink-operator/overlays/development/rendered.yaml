---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "labels": {
      "app.kubernetes.io/managed-by": "Helm",
      "app.kubernetes.io/name": "flink-kubernetes-operator",
      "app.kubernetes.io/version": "1.16.0",
      "helm.sh/chart": "flink-kubernetes-operator-1.16.0"
    },
    "name": "flink-kubernetes-operator",
    "namespace": "platform-flink-operator"
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app.kubernetes.io/name": "flink-kubernetes-operator"
      }
    },
    "strategy": {
      "type": "Recreate"
    },
    "template": {
      "metadata": {
        "annotations": {
          "kubectl.kubernetes.io/default-container": "flink-kubernetes-operator"
        },
        "labels": {
          "app.kubernetes.io/name": "flink-kubernetes-operator"
        }
      },
      "spec": {
        "containers": [
          {
            "command": [
              "/docker-entrypoint.sh",
              "operator"
            ],
            "env": [
              {
                "name": "OPERATOR_NAMESPACE",
                "valueFrom": {
                  "fieldRef": {
                    "fieldPath": "metadata.namespace"
                  }
                }
              },
              {
                "name": "HOST_IP",
                "valueFrom": {
                  "fieldRef": {
                    "fieldPath": "status.hostIP"
                  }
                }
              },
              {
                "name": "POD_IP",
                "valueFrom": {
                  "fieldRef": {
                    "fieldPath": "status.podIP"
                  }
                }
              },
              {
                "name": "POD_NAME",
                "valueFrom": {
                  "fieldRef": {
                    "fieldPath": "metadata.name"
                  }
                }
              },
              {
                "name": "OPERATOR_NAME",
                "value": "flink-kubernetes-operator"
              },
              {
                "name": "FLINK_CONF_DIR",
                "value": "/opt/flink/conf"
              },
              {
                "name": "FLINK_PLUGINS_DIR",
                "value": "/opt/flink/plugins"
              },
              {
                "name": "LOGGING_FRAMEWORK",
                "value": "log4j2"
              },
              {
                "name": "LOG_CONFIG",
