{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "labels": {
      "app": "kube-prometheus-stack-operator",
      "app.kubernetes.io/component": "prometheus-operator",
      "app.kubernetes.io/instance": "atlas-monitoring",
      "app.kubernetes.io/managed-by": "Helm",
      "app.kubernetes.io/name": "kube-prometheus-stack-prometheus-operator",
      "app.kubernetes.io/part-of": "kube-prometheus-stack",
      "app.kubernetes.io/version": "92.3.0",
      "chart": "kube-prometheus-stack-92.3.0",
      "heritage": "Helm",
      "release": "atlas-monitoring"
    },
    "name": "atlas-monitoring-operator",
    "namespace": "platform-monitoring"
  },
  "spec": {
    "replicas": 1,
    "revisionHistoryLimit": 10,
    "selector": {
      "matchLabels": {
        "app": "kube-prometheus-stack-operator",
        "release": "atlas-monitoring"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "kube-prometheus-stack-operator",
          "app.kubernetes.io/component": "prometheus-operator",
          "app.kubernetes.io/instance": "atlas-monitoring",
          "app.kubernetes.io/managed-by": "Helm",
          "app.kubernetes.io/name": "kube-prometheus-stack-prometheus-operator",
          "app.kubernetes.io/part-of": "kube-prometheus-stack",
          "app.kubernetes.io/version": "92.3.0",
          "chart": "kube-prometheus-stack-92.3.0",
          "heritage": "Helm",
          "release": "atlas-monitoring"
        }
      },
      "spec": {
        "automountServiceAccountToken": true,
        "containers": [
          {
            "args": [
              "--kubelet-service=kube-system/atlas-monitoring-kubelet",
              "--kubelet-endpoints=true",
              "--kubelet-endpointslice=false",
              "--localhost=127.0.0.1",
              "--prometheus-config-reloader=quay.io/prometheus-operator/prometheus-config-reloader:v0.94.1@sha256:06b52bd4dbe3ed6dd5905aadaf8b9987d9da4c31d37bb86deaadae68cee2d26b",
              "--config-reloader-cpu-request=10m",
              "--config-reloader-cpu-limit=0",
              "--config-reloader-memory-request=32Mi",
              "--config-reloader-memory-limit=64Mi",
              "--secret-field-selector=type!=kubernetes.io/dockercfg,type!=helm.sh/release.v1",
              "--web.enable-tls=true",
              "--web.cert-file=/cert/tls.crt",
              "--web.key-file=/cert/tls.key",
              "--web.listen-address=:10250",
              "--web.tls-min-version=VersionTLS13"
            ],
            "env": [
              {
                "name": "GOGC",
                "value": "30"
              }
            ],
            "image": "quay.io/prometheus-operator/prometheus-operator:v0.94.1@sha256:7c88d4e7bae63bd8d0f8da986054337c23b4472fa8d3c6817f5bc4b8407a2d6a",
            "imagePullPolicy": "IfNotPresent",
            "livenessProbe": {
              "failureThreshold": 3,
              "httpGet": {
                "path": "/healthz",
                "port": "https",
                "scheme": "HTTPS"
              },
              "initialDelaySeconds": 0,
              "periodSeconds": 10,
              "successThreshold": 1,
              "timeoutSeconds": 1
            },
            "name": "kube-prometheus-stack",
            "ports": [
              {
                "containerPort": 10250,
                "name": "https"
              }
            ],
            "readinessProbe": {
              "failureThreshold": 3,
              "httpGet": {
                "path": "/healthz",
                "port": "https",
                "scheme": "HTTPS"
              },
              "initialDelaySeconds": 0,
              "periodSeconds": 10,
              "successThreshold": 1,
              "timeoutSeconds": 1
            },
            "resources": {
              "limits": {
                "memory": "384Mi"
              },
              "requests": {
                "cpu": "100m",
                "memory": "128Mi"
              }
            },
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              },
              "readOnlyRootFilesystem": true
            },
            "volumeMounts": [
              {
                "mountPath": "/cert",
                "name": "tls-secret",
                "readOnly": true
              }
            ]
          }
        ],
        "nodeSelector": {
          "kubernetes.io/os": "linux",
          "node-role.local/compute": "true"
        },
        "securityContext": {
          "fsGroup": 65534,
          "runAsGroup": 65534,
          "runAsNonRoot": true,
          "runAsUser": 65534,
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "serviceAccountName": "atlas-monitoring-operator",
        "terminationGracePeriodSeconds": 30,
        "volumes": [
          {
            "name": "tls-secret",
            "secret": {
              "defaultMode": 420,
              "secretName": "atlas-monitoring-admission"
            }
          }
        ]
      }
    }
  }
}
