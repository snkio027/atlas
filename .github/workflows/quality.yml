name: Delivery
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  merge_group:
    branches: [main]
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  GOTOOLCHAIN: local
  GOPROXY: 'off'
  GOSUMDB: 'off'
  GOFLAGS: -mod=vendor
  PYTHONDONTWRITEBYTECODE: '1'
  CI_EVENT: ${{ github.event_name }}
  CI_TEST_SHA: ${{ github.sha }}
  CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
  CI_BASE_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref || github.ref }}
  CI_PR_DRAFT: ${{ toJSON(github.event.pull_request.draft) }}
  CI_PR_NUMBER: ${{ github.event.pull_request.number }}
  CI_PR_TITLE: ${{ github.event.pull_request.title }}
jobs:
  fast:
    name: Fast
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          check-latest: false
          cache: false
      - name: Prepare checksum-locked Fast tools
        run: |
          echo "CI_REPORT_DIR=$RUNNER_TEMP/quality-fast" >> "$GITHUB_ENV"
          python3 packaging/prepare-ci.py --fast "$RUNNER_TEMP/atlas-ci-tools"
          echo "$RUNNER_TEMP/atlas-ci-tools" >> "$GITHUB_PATH"
      - name: Fast source and workflow checks
        run: task quality:fast
      - name: Retain Fast evidence, including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-fast-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-fast/
          if-no-files-found: error
          retention-days: 30
  validate:
    name: Rejection probe / ${{ matrix.fault }}
    needs: [fast]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: macos-26
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        fault: [plan-failure, missing-plan, malformed-plan, empty-plan, wrong-candidate, unknown-policy, unknown-mode, execution-failure, missing-artifact]
    outputs:
      plan_result: ${{ steps.plan.outcome }}
      execution_result: ${{ steps.execute.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          check-latest: false
          cache: false
      - name: Prepare bounded rejection probe
        env:
          FAULT: ${{ matrix.fault }}
        run: |
          echo "CI_REPORT_DIR=$RUNNER_TEMP/quality-full" >> "$GITHUB_ENV"
          echo "CI_PLAN_PATH=$RUNNER_TEMP/quality-full/plan.json" >> "$GITHUB_ENV"
          echo "FAULT=$FAULT" >> "$GITHUB_ENV"
          python3 packaging/prepare-ci.py --fast "$RUNNER_TEMP/atlas-ci-tools"
          echo "$RUNNER_TEMP/atlas-ci-tools" >> "$GITHUB_PATH"
      - name: Generate or deliberately reject a real candidate plan
        id: plan
        run: |
          if test "$FAULT" = plan-failure; then exit 42; fi
          if test "$FAULT" = unknown-policy; then
            python3 -c 'import json; from pathlib import Path; p=Path("ci/workflow-policy.json"); d=json.loads(p.read_text()); d["profile"]="unknown"; p.write_text(json.dumps(d))'
          fi
          task quality:plan
      - name: Deliberate missing artifact transport
        if: ${{ matrix.fault == 'missing-artifact' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deliberately-absent-${{ github.run_id }}
          path: ${{ runner.temp }}/absent
      - name: Exercise fail-closed execution entry
        id: execute
        run: |
          case "$FAULT" in
            missing-plan) rm "$CI_PLAN_PATH" ;;
            malformed-plan) printf '{"full_required":' > "$CI_PLAN_PATH" ;;
            empty-plan) printf '{}' > "$CI_PLAN_PATH" ;;
            wrong-candidate) python3 -c 'import json,os; from pathlib import Path; p=Path(os.environ["CI_PLAN_PATH"]); d=json.loads(p.read_text()); d["candidate"]["head"]="f"*40; p.write_text(json.dumps(d))' ;;
            unknown-mode) python3 scripts/quality.py not-a-mode; exit 93 ;;
            execution-failure) exit 43 ;;
          esac
          task quality:full
      - name: Retain plan and execution evidence, including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rejection-${{ matrix.fault }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-full/
          if-no-files-found: warn
          retention-days: 30
  quality:
    name: ${{ github.event_name == 'pull_request' && 'Delivery / Quality / pr-full-standard-v1' || format('Delivery / Quality / {0}-full-standard-v1', github.event_name) }}
    needs: [fast, validate]
    if: ${{ always() }}
    runs-on: macos-26
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    env:
      FAST_RESULT: ${{ needs.fast.result }}
      VALIDATE_RESULT: ${{ needs.validate.result }}
      PLAN_RESULT: ${{ needs.validate.outputs.plan_result }}
      EXECUTION_RESULT: ${{ needs.validate.outputs.execution_result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Reject Draft, unknown, failed, cancelled or missing required stages
        run: python3 scripts/quality.py phase
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quality-fast-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-evidence/fast
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quality-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-evidence/full
      - name: Check candidate, coverage, plan, environment and current PR state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/quality.py gate --reports "$RUNNER_TEMP/quality-evidence"
