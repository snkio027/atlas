apiVersion: v1
kind: List
items:
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: EnvoyProxy
    metadata:
      name: development
      namespace: platform-gateway
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      ipFamily: IPv4
      bootstrap:
        type: JSONPatch
        jsonPatches:
          - op: add
            jsonPath: $.static_resources.clusters[?(@.name == 'xds_cluster')]
            path: /dns_lookup_family
            value: V4_ONLY
      provider:
        type: Kubernetes
        kubernetes:
          envoyDeployment:
            replicas: 1
            container:
              image: docker.io/envoyproxy/envoy:distroless-v1.39.3@sha256:7369b033550a14997e5d698677b7b51f0210a80754f5d084c5caa1a78268267b
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
            pod:
              nodeSelector:
                node-role.local/gateway: "true"
          envoyService:
            type: NodePort
            externalTrafficPolicy: Cluster
            patch:
              type: StrategicMerge
              value:
                spec:
                  ports:
                    - port: 80
                      nodePort: 30080
                    - port: 443
                      nodePort: 30443
  - apiVersion: gateway.networking.k8s.io/v1
    kind: GatewayClass
    metadata:
      name: atlas-envoy
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      controllerName: gateway.envoyproxy.io/gatewayclass-controller
      parametersRef:
        group: gateway.envoyproxy.io
        kind: EnvoyProxy
        name: development
        namespace: platform-gateway
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata:
      name: development
      namespace: platform-gateway
      annotations:
        argocd.argoproj.io/sync-wave: "2"
    spec:
      gatewayClassName: atlas-envoy
      listeners:
        - name: http
          hostname: web.atlas.test
          port: 80
          protocol: HTTP
          allowedRoutes:
            namespaces:
              from: Selector
              selector:
                matchLabels:
                  atlas.io/gateway-access: development
                  kubernetes.io/metadata.name: project-platform-smoke
            kinds:
              - group: gateway.networking.k8s.io
                kind: HTTPRoute
        - name: https
          hostname: web.atlas.test
          port: 443
          protocol: HTTPS
          allowedRoutes:
            namespaces:
              from: Selector
              selector:
                matchLabels:
                  atlas.io/gateway-access: development
                  kubernetes.io/metadata.name: project-platform-smoke
            kinds:
              - group: gateway.networking.k8s.io
                kind: HTTPRoute
          tls:
            mode: Terminate
            certificateRefs:
              - group: ""
                kind: Secret
                name: web-tls
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: BackendTrafficPolicy
    metadata:
      name: ipv4-dns
      namespace: platform-gateway
      annotations:
        argocd.argoproj.io/sync-wave: "2"
    spec:
      targetRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: development
      dns:
        lookupFamily: IPv4
