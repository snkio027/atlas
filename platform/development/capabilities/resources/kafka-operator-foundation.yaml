apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: platform-strimzi-operator
      labels:
        atlas.local/owner: platform
        pod-security.kubernetes.io/enforce: restricted
        atlas.local/class: platform
        atlas.local/domain: streaming
      annotations:
        argocd.argoproj.io/sync-options: Delete=false,Prune=false
  - apiVersion: v1
    kind: ResourceQuota
    metadata:
      name: platform-budget
      namespace: platform-strimzi-operator
    spec:
      hard:
        requests.cpu: 500m
        requests.memory: 1Gi
        limits.memory: 1Gi
        requests.storage: "0"
        persistentvolumeclaims: "0"
        pods: "4"
  - apiVersion: v1
    kind: LimitRange
    metadata:
      name: defaults
      namespace: platform-strimzi-operator
    spec:
      limits:
        - type: Container
          default:
            memory: 256Mi
          defaultRequest:
            cpu: 10m
            memory: 32Mi
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: default-deny
      namespace: platform-strimzi-operator
    spec:
      podSelector: {}
      policyTypes:
        - Ingress
        - Egress
      ingress: []
      egress: []
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: dns
      namespace: platform-strimzi-operator
    spec:
      podSelector: {}
      policyTypes:
        - Egress
      egress:
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: kube-system
              podSelector:
                matchLabels:
                  k8s-app: kube-dns
          ports:
            - protocol: UDP
              port: 53
            - protocol: TCP
              port: 53
