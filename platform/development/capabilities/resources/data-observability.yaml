apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: loki-datasource
      namespace: platform-monitoring
      labels:
        grafana_datasource: "1"
    data:
      loki.yaml: |
        apiVersion: 1
        datasources:
          - name: Loki
            uid: loki
            type: loki
            access: proxy
            url: http://loki.platform-logging.svc.cluster.local:3100
            isDefault: false
            editable: false
  - apiVersion: monitoring.coreos.com/v1
    kind: ServiceMonitor
    metadata:
      name: loki
      namespace: platform-monitoring
      labels:
        release: atlas-monitoring
    spec:
      namespaceSelector:
        matchNames:
          - platform-logging
      selector:
        matchLabels:
          app.kubernetes.io/name: loki
      endpoints:
        - port: http
          interval: 30s
  - apiVersion: monitoring.coreos.com/v1
    kind: ServiceMonitor
    metadata:
      name: alloy
      namespace: platform-monitoring
      labels:
        release: atlas-monitoring
    spec:
      namespaceSelector:
        matchNames:
          - platform-logging
      selector:
        matchLabels:
          app.kubernetes.io/name: alloy
      endpoints:
        - port: http
          interval: 30s
  - apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: data-platform
      namespace: platform-monitoring
      labels:
        release: atlas-monitoring
    spec:
      groups:
        - name: data-platform
          rules:
            - alert: DataPlatformPodNotReady
              expr: kube_pod_status_ready{namespace=~"postgresql|redis|kafka|flink|logging",condition="false"} == 1
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: Data platform Pod is not Ready; functional protocol checks are separate.
            - alert: DataPlatformVolumeAlmostFull
              expr: kubelet_volume_stats_available_bytes{namespace=~"postgresql|redis|kafka|flink|logging"} / kubelet_volume_stats_capacity_bytes{namespace=~"postgresql|redis|kafka|flink|logging"} < 0.15
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: Data platform PVC has less than 15% free space.
