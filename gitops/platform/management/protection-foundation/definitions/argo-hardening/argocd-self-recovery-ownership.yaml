apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-self
  namespace: argocd
  labels:
    atlas.io/definition-state: uninstalled
  annotations:
    atlas.io/candidate-projection: recovery-guard-ownership
spec:
  project: platform-project
  sources:
    - repoURL: https://github.com/snkio027/atlas.git
      targetRevision: main
      path: vendor/charts/argo-cd-10.3.3
      helm:
        releaseName: atlas-argocd
        valueFiles:
          - $values/gitops/platform/management/argocd-self/values.yaml
    - repoURL: https://github.com/snkio027/atlas.git
      targetRevision: main
      path: gitops/platform/management/argocd-self/base
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  ignoreDifferences:
    - group: ""
      kind: ConfigMap
      namespace: argocd
      name: argocd-rbac-cm
      jsonPointers:
        - /data/policy.atlas-recovery-freeze.csv
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
