apiVersion: v1
kind: List
items:
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: operator-control
      namespace: platform-strimzi-operator
    spec:
      podSelector:
        matchLabels:
          strimzi.io/kind: cluster-operator
      policyTypes:
        - Ingress
        - Egress
      ingress: []
      egress:
        - ports:
            - protocol: TCP
              port: 443
            - protocol: TCP
              port: 6443
        - to:
            - podSelector:
                matchLabels:
                  strimzi.io/cluster: kafka
              namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: service-kafka
          ports:
            - protocol: TCP
              port: 9091
            - protocol: TCP
              port: 9093
            - protocol: TCP
              port: 9090
            - protocol: TCP
              port: 8080
