apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
networking:
  ipFamily: ipv4
  apiServerAddress: 127.0.0.1
  disableDefaultCNI: true
  kubeProxyMode: iptables
nodes:
  - role: control-plane
  - role: worker
    labels:
      node-role.local/gateway: "true"
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: 127.0.0.1
        protocol: TCP
      - containerPort: 30443
        hostPort: 8443
        listenAddress: 127.0.0.1
        protocol: TCP
  - role: worker
    labels:
      node-role.local/compute: "true"
  - role: worker
    labels:
      node-role.local/data: "true"
      topology.kubernetes.io/zone: data-zone-1
    kubeadmConfigPatches:
      - |
        apiVersion: kubeadm.k8s.io/v1beta4
        kind: JoinConfiguration
        nodeRegistration:
          taints:
            - key: node-role.local/data
              value: "true"
              effect: NoSchedule
