kubeProxyReplacement: false
ipam:
  mode: kubernetes
ipv4:
  enabled: true
ipv6:
  enabled: false
operator:
  replicas: 1
l7Proxy: false
envoy:
  enabled: false
hubble:
  enabled: false
gatewayAPI:
  enabled: false
ingressController:
  enabled: false
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
bpf:
  autoMount:
    enabled: false
securityContext:
  privileged: true
tls:
  readSecretsOnlyFromSecretsNamespace: true
  secretsNamespace:
    create: false
    name: ""
  secretSync:
    enabled: false
