apiVersion: v1
kind: List
items:
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: sealed-secrets-namespace-reader
    rules:
      - apiGroups:
          - ""
        resources:
          - namespaces
        resourceNames:
          - platform-monitoring
          - service-object-storage
          - project-platform-smoke
        verbs:
          - get
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: sealed-secrets-namespace-reader
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: sealed-secrets-namespace-reader
    subjects:
      - kind: ServiceAccount
        name: sealed-secrets
        namespace: platform-sealed-secrets
