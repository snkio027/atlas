  - apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: foundation
      namespace: platform-argocd
      annotations:
        argocd.argoproj.io/sync-wave: "-100"
        argocd.argoproj.io/sync-options: Prune=confirm,Delete=false
    spec:
      project: platform-project
      source:
        repoURL: https://github.com/snkio027/atlas-refactor.git
        targetRevision: codex/development-platform
        path: gitops/platform/foundation/overlays/development
      destination:
        server: https://kubernetes.default.svc
        namespace: platform-argocd
      syncPolicy:
        automated:
          enabled: true
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
          - FailOnSharedResource=true
