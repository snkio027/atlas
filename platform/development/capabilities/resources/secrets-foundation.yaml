apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: platform-sealed-secrets
      labels:
        atlas.local/owner: platform
        pod-security.kubernetes.io/enforce: restricted
        atlas.local/class: platform
        atlas.local/domain: security
      annotations:
        argocd.argoproj.io/sync-options: Delete=false,Prune=false
  - apiVersion: v1
    kind: ResourceQuota
    metadata:
      name: platform-budget
      namespace: platform-sealed-secrets
    spec:
      hard:
        requests.cpu: "3"
        requests.memory: 4Gi
        limits.memory: 8Gi
        requests.storage: 32Gi
        persistentvolumeclaims: "8"
        pods: "32"
  - apiVersion: v1
    kind: LimitRange
    metadata:
      name: defaults
      namespace: platform-sealed-secrets
    spec:
      limits:
        - type: Container
          default:
            memory: 256Mi
          defaultRequest:
            cpu: 10m
            memory: 32Mi
