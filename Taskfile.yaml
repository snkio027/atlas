version: '3'

env:
  GOTOOLCHAIN: local
  GOPROXY: 'off'
  GOSUMDB: 'off'
  GOFLAGS: -mod=vendor

vars:
  LOCAL_OT1_TOOLS: '{{.ROOT_DIR}}/.state/tools/ot1'
  LOCAL_HELM:
    sh: 'if test -x "{{.ROOT_DIR}}/.state/tools/helm"; then printf "%s" "{{.ROOT_DIR}}/.state/tools/helm"; else printf "%s" "helm"; fi'
  LOCAL_KUBECTL:
    sh: 'if test -x "{{.ROOT_DIR}}/.state/tools/kubectl"; then printf "%s" "{{.ROOT_DIR}}/.state/tools/kubectl"; else printf "%s" "kubectl"; fi'
  LOCAL_YQ:
    sh: 'if test -x "{{.ROOT_DIR}}/.state/tools/yq"; then printf "%s" "{{.ROOT_DIR}}/.state/tools/yq"; else printf "%s" "yq"; fi'
  LOCAL_KUBESEAL:
    sh: 'if test -x "{{.ROOT_DIR}}/.state/tools/kubeseal"; then printf "%s" "{{.ROOT_DIR}}/.state/tools/kubeseal"; else printf "%s" "kubeseal"; fi'

tasks:
  toolchain:
    cmds:
      - test "$(go env GOVERSION)" = "go1.27.2"
  check:
    cmds:
      - task: toolchain
      - test -z "$(gofmt -l cmd internal experiments)"
      - go vet ./...
  test:
    env:
      ATLAS_TEST_LUA: '{{.PLATFORM_LUA | default "lua"}}'
      ATLAS_TEST_HELM: '{{.PLATFORM_HELM | default .LOCAL_HELM}}'
      ATLAS_TEST_KUBECTL: '{{.PLATFORM_KUBECTL | default .LOCAL_KUBECTL}}'
      ATLAS_TEST_KUBESEAL: '{{.KUBESEAL | default .LOCAL_KUBESEAL}}'
      ATLAS_TEST_OT1_TOOL_DIR: '{{.OT1_TOOLS | default .LOCAL_OT1_TOOLS}}'
    cmds:
      - task: toolchain
      # Full S1 fixture suites exceed Go's default 10m budget on hosted ARM runners.
      - go test -race -timeout 25m ./...
  quality:
    cmds:
      - task: check
      - task: test
      - task: platform:check
      - task: ot1:contracts
      - task: experiments:check
  build:
    cmds:
      - task: toolchain
      - mkdir -p bin
      - env CGO_ENABLED=0 go build -trimpath -o bin/atlas ./cmd/atlas
      - env CGO_ENABLED=0 go build -trimpath -o bin/atlas-dev ./cmd/atlas-dev
      - env CGO_ENABLED=0 go build -trimpath -o bin/atlas-artifacts ./cmd/atlas-artifacts
      - env CGO_ENABLED=0 go build -trimpath -o bin/atlas-platform ./cmd/atlas-platform
      - env CGO_ENABLED=0 go build -trimpath -o bin/atlas-ot1 ./cmd/atlas-ot1
  build:matrix:
    cmds:
      - task: toolchain
      - mkdir -p bin
      - env CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o bin/atlas-darwin-arm64 ./cmd/atlas
      - env CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o bin/atlas-linux-amd64 ./cmd/atlas
      - env CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o bin/atlas-linux-arm64 ./cmd/atlas
  release:candidate:
    desc: Build a complete clean-commit D1 archive locally; never publishes or starts a cluster
    cmds:
      - task: quality
      - go run ./cmd/atlas-release --version '{{.VERSION}}' --tool-dir "$(dirname '{{.PLATFORM_HELM | default .LOCAL_HELM}}')" --output '{{.OUTPUT | default ".state/latest/d1-package"}}'

  platform:plan:
    desc: Show capability dependency closure and missing sealed credentials; no cluster operations
    cmds:
      - go run ./cmd/atlas-platform plan --capabilities '{{.CAPABILITIES | default "monitoring,object-storage,storage-monitoring"}}'
  platform:select:
    desc: Select capabilities in the local worktree only; never publishes or applies
    cmds:
      - go run ./cmd/atlas-platform select --capabilities '{{.CAPABILITIES}}'
  platform:credentials:
    desc: Seal locally generated credentials using a reviewed public certificate
    cmds:
      - go run ./cmd/atlas-platform prepare-credentials --cert '{{.CERT}}' --kubeseal '{{.KUBESEAL | default .LOCAL_KUBESEAL}}'
  platform:render:
    desc: Render the development candidate locally; never contacts a cluster
    cmds:
      - task: toolchain
      - go run ./cmd/atlas-platform render --helm '{{.PLATFORM_HELM | default .LOCAL_HELM}}' --kubectl '{{.PLATFORM_KUBECTL | default .LOCAL_KUBECTL}}' --yq '{{.PLATFORM_YQ | default .LOCAL_YQ}}'
      # D1 derives the adoption signal from each installation's own identity.
      # The legacy schema-3 profile retains its original dependency snapshot.
  platform:check:
    desc: Check local renders, Kustomize, schemas and architecture boundaries
    cmds:
      - task: toolchain
      - go run ./cmd/atlas-platform check --helm '{{.PLATFORM_HELM | default .LOCAL_HELM}}' --kubectl '{{.PLATFORM_KUBECTL | default .LOCAL_KUBECTL}}' --yq '{{.PLATFORM_YQ | default .LOCAL_YQ}}'

  ot1:contracts:
    desc: Immutable OT-1 scope/stages and four local Kustomize fixtures; no cluster calls
    cmds:
      - env PYTHONDONTWRITEBYTECODE=1 python3 experiments/foundation-ownership/contract.py
      - env PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s experiments/foundation-ownership -v
      - for layout in source secrets observability storage; do '{{.PLATFORM_KUBECTL | default .LOCAL_KUBECTL}}' kustomize "experiments/foundation-ownership/fixtures/$layout" >/dev/null || exit; done

  experiments:check:
    desc: Compile and vet frozen OT-1 entry points without running their commands
    cmds:
      - task: toolchain
      - go test -tags 'ot1_finalization ot1_f12_recovery ot1_stage12_continuation' ./experiments/foundation-ownership/...
      - go vet -tags 'ot1_finalization ot1_f12_recovery ot1_stage12_continuation' ./experiments/foundation-ownership/...
